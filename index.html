<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <!-- Seção de Apresentação com Duas Colunas -->
<section class="py-16 px-8 bg-gray-50 border-t border-gray-200 shadow-inner">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center">

      <!-- Lado Esquerdo: Título, Subtítulo e Texto -->
      <div class="flex flex-col space-y-4">
        <h1 class="text-4xl font-bold text-gray-900">Bem-vindo ao Portfólio</h1>
        <h2 class="text-2xl text-gray-700">Desenvolvedor Full-Stack</h2>
        <p class="text-lg text-gray-600 leading-relaxed">
          Aqui você encontra meus projetos, habilidades e experiências. Vamos construir algo incrível juntos!
        </p>
      </div>
      
      <!-- Lado Direito: Imagem Placeholder -->
      <div class="flex justify-center">
        <img 
          src="https://picsum.photos/400" 
          alt="Imagem de apresentação" 
          class="w-full max-w-sm h-auto rounded-lg shadow-md"
        >
      </div>
    </div>
  </section>
  
  <!-- 
  Escolhi usar Grid (grid-cols-1 md:grid-cols-2) porque é ideal para layouts de duas colunas responsivas, garantindo alinhamento preciso e consistência visual sem precisar de flex-direction ou ajustes manuais. Flex poderia ser usado, mas Grid oferece melhor controle sobre colunas e gaps em telas maiores, alinhando com as habilidades trabalhadas (grid-cols-*, gap-*). 
  -->
</body>
</html>
